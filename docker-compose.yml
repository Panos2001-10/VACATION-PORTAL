services:
  app:
    build: .
    container_name: vacation-portal-app
    volumes:
      - ./public:/var/www/html/public
      - ./src:/var/www/html/src
      - ./vendor:/var/www/html/vendor
      - ./.env:/var/www/html/.env
      - ./templates:/var/www/html/templates
    ports:
      - "8000:80"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: rootpassword
      DB_NAME: vacation_db

  db:
    image: mysql:5.7
    container_name: vacation-portal-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: vacation_db
    volumes:
      - ./database/vacation_db.sql:/docker-entrypoint-initdb.d/dump.sql
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  db_data:
